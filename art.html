<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Home - cartoons.io</title>
  <link rel="stylesheet" href="https://use.typekit.net/eyd0ghc.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
</head>

<!-- Legal Modal / Chatbox -->
<div class="legal-modal" id="legalModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Title</h3>
      <button class="modal-close" id="modalClose">x</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Content changes based on which link was clicked -->
    </div>
  </div>
</div>

<body>
<header>
  <div class="header-container">
    <!-- Logo linked to home -->
    <a href="index.html" class="logo-link">
      <img src="assets/wordmark.png" alt="Cartoons Wordmark" class="logo">
    </a>

<!-- Navigation -->
<nav style="display:flex; align-items:center; gap: 2rem;">
    <a href="https://opensea.io/collection/cartoonsnft/explore" target="_blank" rel="noopener noreferrer">nfts</a>
    <a href="games.html">games</a>
    <a href="art.html">art</a>
    <a href="docs.html">docs</a>
    
    <!-- Social Icons - placed to the right of the menu -->
    <div class="social-links" style="display:flex; gap:12px; align-items:center;">
        <a href="https://x.com/cartoonsnft" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
            <img src="assets/icons/xBL.png" alt="X icon" class="social-icon">
        </a>
        <a href="https://discord.gg/Xs4Cnn3bAp" target="_blank" rel="noopener noreferrer" aria-label="Discord">
            <img src="assets/icons/discordBL.png" alt="Discord icon" class="social-icon">
        </a>
    </div>
</nav>
  </div>

<!-- Centered 2px line with 20px side margins -->
<div class="divider-line"></div>

</header>

<main>

<!-- NFT GALLERY SECTION -->
<section class="nft-gallery-section">
  <div class="gallery-header">
    <h2 class="section-title">Our Collection</h2>
    
    <div class="gallery-filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="1of1">Artist 1/1s</button>
      <button class="filter-btn" data-filter="bat">Build-a-Toons</button>
    </div>
  </div>

  <div id="nft-grid" class="nft-grid">
    <!-- JS will fill this with images -->
  </div>

  <div class="gallery-footer">
    <a href="https://opensea.io/collection/cartoonsnft/explore" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="cta-button">See Full Collection on OpenSea →</a>
  </div>
</section>

<!-- 50px spacer -->
<div class="spacer-100"></div>


<!-- SECTION 2 -->
<section class="white-block">
  <div class="white-block-wrapper">
    <!-- Left: Square image (1/3 width) -->
    <img src="assets/gallery1/classic.png" alt="Classic Square Image" class="square-image">

    <!-- Right: Title, blurb, stats carousel, CTA button (2/3 width) -->
    <div class="right-content">
      <h2 class="section-title">TOONUP Classics</h2>
      <p class="section-blurb">
        (airdrop collection)
        The classics you remember.
      </p>
      
    <a href="https://opensea.io/collection/toonup-classics" target="_blank" rel="noopener noreferrer" class="cta-button">Explore</a>
    </div>
  </div>
</section>

<!-- Centered 2px line with 20px side margins -->
<div class="divider-line"></div>

<footer>
  <div class="footer-container">
    <p>Cartoons, LLC. All Rights Reserved. &copy;</p>
    
    <!-- Legal links centered -->
    <div class="footer-legal-links">
      <a href="#" class="legal-link" data-type="faq">faq</a>
      <a href="#" class="legal-link" data-type="disclaimer">disclaimer</a>
      <a href="#" class="legal-link" data-type="terms">terms of use</a>
      <a href="#" class="legal-link" data-type="privacy">privacy policy</a>
    </div>

    <div class="social-links">
      <a href="https://x.com/cartoonsnft" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <img src="assets/icons/xBL.png" alt="X icon" class="social-icon">
      </a>
      <a href="https://discord.gg/Xs4Cnn3bAp" target="_blank" rel="noopener noreferrer" aria-label="Discord">
        <img src="assets/icons/discordBL.png" alt="Discord icon" class="social-icon">
      </a>
      <a href="https://opensea.io/collection/cartoonsnft" target="_blank" rel="noopener noreferrer" aria-label="OpenSea">
        <img src="assets/icons/openseaBL.png" alt="OpenSea icon" class="social-icon">
      </a>
    </div>
  </div>
</footer>

  <script type="module" src="script.js"></script>
</body>
</html>
